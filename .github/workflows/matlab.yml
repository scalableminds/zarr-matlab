name: MATLAB Tests

# Controls when the action will run.
on:
  push:
    branches: ["**"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        # Intel macOS is only supported up to R2025b; newer releases fail to
        # install on the macos-15-intel runner. Everyone else uses the latest.
        include:
          - os: macos-15-intel
            release: R2025b

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release || 'latest' }}

      - name: Run zarrBuild
        uses: matlab-actions/run-command@v2
        with:
          command: cd zarr-matlab, zarrBuild

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: zarr-matlab
          select-by-folder: zarr-matlab/tests

      # zarr-python interop tests: on ubuntu-latest only. They validate
      # on-disk format compatibility, not OS-specific behavior, and they need
      # a real zarr-python install (via uv, matching zarr-matlab/tests-interop)
      # that the other 3 legs don't have -- see zarr-matlab/tests-interop/README.md.
      - name: Setup uv (interop tests)
        if: matrix.os == 'ubuntu-latest'
        # astral-sh/setup-uv only publishes floating major-version tags
        # (v1..v7); v8/v9 exist solely as exact tags, so this is pinned to
        # the latest exact release rather than a `v9`-style floating tag.
        uses: astral-sh/setup-uv@v9.0.0

      - name: Warm up zarr-python interop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: uv run zarr-matlab/tests-interop/zarr_interop_cli.py --help

      - name: Run zarr-python interop tests
        if: matrix.os == 'ubuntu-latest'
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: zarr-matlab
          select-by-folder: zarr-matlab/tests-interop

      - uses: actions/upload-artifact@v4
        with:
          name: mex-${{ matrix.os }}
          path: zarr-matlab/zarrMex.mex*

  package-toolbox:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all MEX artifacts
        uses: actions/download-artifact@v4
        with:
          path: mex-artifacts
          pattern: mex-*

      - name: Collect MEX files
        run: |
          cp mex-artifacts/mex-*/* zarr-matlab/
          ls -la zarr-matlab/zarrMex.*

      - name: Create zip archive
        run: |
          zip -r zarr-matlab-${{ steps.version.outputs.version }}.zip zarr-matlab/{Zarr*.m,zarrMex.*,tests}

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Package toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: cd zarr-matlab, zarrPackage('${{ steps.version.outputs.version }}')

      - name: Rename toolbox
        run: |
          mv zarr-matlab/zarr-matlab.mltbx zarr-matlab-${{ steps.version.outputs.version }}.mltbx

      - name: Upload toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarr-matlab-toolbox
          path: zarr-matlab-${{ steps.version.outputs.version }}.mltbx

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarr-matlab-zip
          path: zarr-matlab-${{ steps.version.outputs.version }}.zip

  release:
    needs: package-toolbox
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download toolbox artifact
        uses: actions/download-artifact@v4
        with:
          name: zarr-matlab-toolbox

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: zarr-matlab-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zarr-matlab-${{ steps.version.outputs.version }}.mltbx
            zarr-matlab-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
