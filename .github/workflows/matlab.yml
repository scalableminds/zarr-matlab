name: MATLAB Tests

# Controls when the action will run.
on:
  push:
    branches: ["**"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run zarrBuild
        uses: matlab-actions/run-command@v2
        with:
          command: cd zarr-matlab, zarrBuild

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: zarr-matlab
          select-by-folder: zarr-matlab/tests

      - uses: actions/upload-artifact@v4
        with:
          name: mex-${{ matrix.os }}
          path: zarr-matlab/zarrMex.mex*

  package-toolbox:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all MEX artifacts
        uses: actions/download-artifact@v4
        with:
          path: mex-artifacts
          pattern: mex-*

      - name: Collect MEX files
        run: |
          cp mex-artifacts/mex-*/* zarr-matlab/
          ls -la zarr-matlab/zarrMex.*

      - name: Create archive
        run: |
          zip -r zarr-matlab-${{ steps.version.outputs.version }}.zip zarr-matlab -x "zarr-matlab/tests/*" -x "zarr-matlab/*.prj"

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Package toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: cd zarr-matlab, zarrPackage('${{ steps.version.outputs.version }}')

      - name: Rename toolbox
        run: |
          mv zarr-matlab/zarr-matlab.mltbx zarr-matlab-${{ steps.version.outputs.version }}.mltbx

      - name: Upload toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarr-matlab-toolbox
          path: zarr-matlab-${{ steps.version.outputs.version }}.mltbx

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarr-matlab-zip
          path: zarr-matlab-${{ steps.version.outputs.version }}.zip

  release:
    needs: package-toolbox
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download toolbox artifact
        uses: actions/download-artifact@v4
        with:
          name: zarr-matlab-toolbox

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: zarr-matlab-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zarr-matlab-${{ steps.version.outputs.version }}.mltbx
            zarr-matlab-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
